name: deploy dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: https://npm.pkg.github.com/
          scope: "@codebam"
      - run: npm install @codebam/cf-workers-telegram-bot@nightly
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npm install
        env:
          NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
